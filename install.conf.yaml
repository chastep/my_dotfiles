- defaults:
    link:
      relink: true
      create: true

- clean: ['~', '~/bin']

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  -
    command: ./macos/setup-homebrew.sh
    description: Installing Homebrew and Essential Packages
    stdout: true
  -
    description: Downloading vim-plug to ~/.vim/autoload/plug.vim
    command: curl -fLo ~/.vim/autoload/plug.vim --create-dirs https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
    stdout: true

- link:
    # ~/.dotfiles: ''

    ~/.vimrc: vim/vimrc
    ~/.config/nvim:
      path: nvim
      force: true

    ~/.zshrc:
      path: zsh/zshrc.zsh
      force: true
    ~/.zgenom: zsh/zgenom
    ~/.hushlogin: zsh/hushlogin
    ~/.asdfrc: zsh/asdfrc
    ~/.tool-versions: .tool-versions

    ~/.config/ghostty:
      path: ghostty
      force: true

    ~/.config/fastfetch:
      path: fastfetch
      force: true

    ~/bin:
      glob: true
      path: scripts/*
      relink: true

    # VS Code MacOS
    ~/Library/Application Support/Code/User:
      glob: true
      path: vscode/macos/settings.json
      force: true

- shell:
  -
    command: ./git/set-gitconfig.sh
    description: Configuring Git
    stdout: true
    quiet: false
  -
    command: yarn config set prefix ~/.yarn
    description: Configuring yarn prefix
    stdout: true
    quiet: false
